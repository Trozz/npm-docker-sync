# npm-docker-sync -- example configuration
# Secrets can be inline here OR pulled from env vars. See each field's comment.

[npm]
url = "http://nginx-proxy-manager:81"

# Email + password authentication:
email = "admin@example.com"

# Pick ONE of the following two (or omit both -> defaults to reading NPM_PASSWORD env):
# password = "hunter2"                # inline literal -- never override via env
# password_env = "NPM_PASSWORD"       # name of env var holding the password

# Alternative: pre-generated token auth. Mutually exclusive with email/password.
# token = "eyJ..."                    # inline literal
# token_env = "NPM_TOKEN"             # env var name

# Let's Encrypt registration email. Required when defaults.ssl = true.
letsencrypt_email = "ops@example.com"

[docker]
socket = "/var/run/docker.sock"

[forward_host]
# container_name | container_ip | host_port
strategy = "container_name"
network = "proxy"
# host_address = "host.docker.internal"   # only used when strategy = "host_port"

[reconciler]
interval_seconds = 300

[cleanup]
on_remove = true

[cloudflare]
# Pick ONE of the following two (or omit both -> defaults to reading CF_API_TOKEN env):
# api_token = "cf_literal_token"      # inline literal
# api_token_env = "CF_API_TOKEN"      # env var name

# Per-domain token overrides. Each value is tagged:
#   { env = "ENV_VAR_NAME" }    -- read from environment
#   { token = "literal" }       -- inline literal
# Leave the table empty or omit it to use the global token for every domain.
[cloudflare.domains]
# "example.com" = { env = "CF_TOKEN_EXAMPLE" }
# "other.com"   = { token = "cf_literal_token_here" }

[defaults]
scheme = "http"          # http | https
ssl = true               # request LE cert via Cloudflare DNS-01 when true
websockets = true
block_exploits = true

[logging]
level = "info"           # trace | debug | info | warn | error
format = "json"          # json | pretty

[metrics]
enabled = false                    # flip to true to expose /metrics
bind = "0.0.0.0:9090"              # bind address
