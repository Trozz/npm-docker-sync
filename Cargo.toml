[package]
name = "npm-docker-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Sync Docker container labels into Nginx Proxy Manager"
license = "MIT"

[dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
bollard = "0.20"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
humantime-serde = "1"
url = "2"
futures-util = "0.3"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
rand = "0.9"

[dev-dependencies]
wiremock = "0.6"
testcontainers = "0.27"
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
